<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiendaConvatec · CRM Operativo</title>
<style>
  :root{
    --bg:#F4F1F9; --surface:#fff; --ink:#241830; --muted:#7A7186; --soft:#9A92A6;
    --line:#ECE5F4; --plum:#C2168C; --teal:#6E2C91; --teal-deep:#4B1D6E; --mint:#F4ECFA;
    --ok:#1E9E6A; --okbg:#E4F6EE; --warn:#C97A12; --warnbg:#FBF0DD; --bad:#C0392B; --badbg:#FBE7E4;
    --info:#2563C9; --infobg:#E6EEFB;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--ink); background:var(--bg); display:flex; height:100vh; overflow:hidden}

  /* ---- Sidebar ---- */
  .side{flex:0 0 232px; background:linear-gradient(180deg,#4B1D6E,#3A1556); color:#fff;
    display:flex; flex-direction:column; padding:18px 14px; gap:4px}
  .logo{display:flex; align-items:center; gap:10px; padding:4px 8px 16px}
  .logo .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--plum),#8A2C8E)}
  .logo b{font-size:15.5px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.1}
  .logo span{font-size:11px;color:#CDBEE0}
  .nav{display:flex; flex-direction:column; gap:2px; margin-top:4px}
  .nav button{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 12px; border:none; background:transparent; color:#D9CEE9; cursor:pointer;
    border-radius:10px; font:inherit; font-size:13.5px; font-weight:600; transition:.15s}
  .nav button svg{flex:0 0 18px}
  .nav button:hover{background:rgba(255,255,255,.08); color:#fff}
  .nav button.active{background:rgba(255,255,255,.16); color:#fff}
  .nav .cat{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#9C84B8;
    padding:14px 12px 4px}
  .side .foot{margin-top:auto; padding:10px 8px; font-size:11px; color:#A88FC4; line-height:1.5}
  .side .foot button{margin-top:8px; width:100%; background:rgba(255,255,255,.08); color:#E7DBF3;
    border:1px solid rgba(255,255,255,.14); border-radius:9px; padding:8px; font:inherit;
    font-size:11.5px; font-weight:600; cursor:pointer}
  .side .foot button:hover{background:rgba(255,255,255,.15)}

  /* ---- Main ---- */
  .main{flex:1 1 auto; display:flex; flex-direction:column; overflow:hidden}
  .top{flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:14px 24px;
    background:var(--surface); border-bottom:1px solid var(--line)}
  .top h1{font-size:18px; font-weight:800; letter-spacing:-.02em; color:var(--teal-deep)}
  .top .sub{font-size:12.5px; color:var(--muted); margin-top:1px}
  .search{margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--bg);
    border:1px solid var(--line); border-radius:11px; padding:9px 13px; width:280px}
  .search input{border:none; background:transparent; outline:none; font:inherit; font-size:13.5px;
    width:100%; color:var(--ink)}
  .liveDot{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600;
    color:var(--ok); background:var(--okbg); padding:7px 12px; border-radius:20px}
  .liveDot i{width:8px;height:8px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 0 rgba(30,158,106,.5); animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,158,106,.5)}70%{box-shadow:0 0 0 8px rgba(30,158,106,0)}100%{box-shadow:0 0 0 0 rgba(30,158,106,0)}}

  .scroll{flex:1 1 auto; overflow:auto; padding:24px}
  .page{display:none} .page.active{display:block}

  /* ---- Cards / grid ---- */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px}
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px}
  .kpi .lbl{font-size:12px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:7px}
  .kpi .val{font-size:26px; font-weight:800; letter-spacing:-.02em; margin-top:8px; color:var(--teal-deep)}
  .kpi .delta{font-size:11.5px; margin-top:5px; font-weight:600}
  .kpi .delta.up{color:var(--ok)} .kpi .delta.down{color:var(--bad)}
  .kico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--mint);color:var(--plum)}

  .grid2{display:grid; grid-template-columns:1.6fr 1fr; gap:18px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
  .card .hd{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line)}
  .card .hd h2{font-size:14.5px; font-weight:800; color:var(--teal-deep)}
  .card .hd .pill{margin-left:auto; font-size:11.5px; color:var(--muted)}
  .card .bd{padding:6px 0}

  /* ---- Table ---- */
  table{width:100%; border-collapse:collapse; font-size:13px}
  thead th{text-align:left; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--soft); font-weight:700; padding:10px 18px; border-bottom:1px solid var(--line)}
  tbody td{padding:12px 18px; border-bottom:1px solid #F4EFF9; vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s} tbody tr:hover{background:#FBF8FE}
  tbody tr.clickable{cursor:pointer}
  .mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
  .strong{font-weight:700; color:var(--ink)}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
    padding:4px 9px; border-radius:20px; white-space:nowrap}
  .b-ok{background:var(--okbg); color:var(--ok)} .b-warn{background:var(--warnbg); color:var(--warn)}
  .b-bad{background:var(--badbg); color:var(--bad)} .b-info{background:var(--infobg); color:var(--info)}
  .b-mut{background:#F0ECF6; color:var(--muted)} .b-plum{background:var(--mint); color:var(--plum)}
  .chan{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--muted)}
  .chan svg{opacity:.8}

  .av{width:34px;height:34px;border-radius:50%; display:grid; place-items:center; color:#fff;
    font-weight:700; font-size:13px; flex:0 0 34px}
  .cli{display:flex; align-items:center; gap:11px}
  .cli .nm{font-weight:700; font-size:13px; line-height:1.2} .cli .mt{font-size:11.5px; color:var(--soft)}

  /* progress flow */
  .flow{display:flex; align-items:center; gap:0}
  .flow .st{flex:1; height:5px; background:#EFE9F6; position:relative}
  .flow .st.done{background:var(--plum)}
  .flow .st:first-child{border-radius:4px 0 0 4px} .flow .st:last-child{border-radius:0 4px 4px 0}

  .btn{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:9px;
    border:1px solid var(--line); background:var(--surface); color:var(--teal-deep); font:inherit;
    font-size:12.5px; font-weight:700; cursor:pointer; transition:.15s}
  .btn:hover{border-color:var(--plum); color:var(--plum)}
  .btn.pri{background:linear-gradient(135deg,var(--plum),var(--teal)); color:#fff; border:none}
  .btn.pri:hover{filter:brightness(1.06)}
  .btn.sm{padding:5px 9px; font-size:11.5px}

  .bars{margin-top:6px}
  .bar{height:8px; border-radius:6px; background:#EFE9F6; overflow:hidden; margin-top:7px}
  .bar i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--plum),var(--teal))}

  /* ---- Clientes list ---- */
  .cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px}
  .ccard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px;
    cursor:pointer; transition:.15s} .ccard:hover{box-shadow:0 8px 24px rgba(75,29,110,.1); transform:translateY(-2px)}
  .ccard .row{display:flex; align-items:center; gap:12px}
  .ccard .meta{margin-top:13px; display:grid; grid-template-columns:1fr 1fr; gap:9px 12px; font-size:12px}
  .ccard .meta .k{color:var(--soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em}
  .ccard .meta .v{font-weight:600; margin-top:2px}

  /* ---- Drawer (hoja de vida) ---- */
  .drawer-bg{position:fixed; inset:0; background:rgba(40,20,55,.42); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:.22s; z-index:40}
  .drawer-bg.open{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100%; width:560px; max-width:94vw; background:var(--bg);
    box-shadow:-20px 0 60px rgba(40,20,55,.25); transform:translateX(100%); transition:.26s cubic-bezier(.4,0,.2,1);
    z-index:41; display:flex; flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{background:linear-gradient(135deg,var(--teal-deep),#3A1556); color:#fff; padding:20px 22px}
  .drawer .dh .x{position:absolute; top:16px; right:18px; background:rgba(255,255,255,.16); border:none;
    color:#fff; width:32px;height:32px;border-radius:9px; cursor:pointer; font-size:17px}
  .drawer .db{flex:1; overflow:auto; padding:20px 22px}
  .sec{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px}
  .sec h3{font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--plum);
    font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px}
  .dl{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px}
  .dl .k{font-size:11px; color:var(--soft); text-transform:uppercase; letter-spacing:.03em}
  .dl .v{font-size:13.5px; font-weight:600; margin-top:2px}
  .tl{position:relative; padding-left:20px}
  .tl:before{content:""; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--line)}
  .tl .ev{position:relative; padding:0 0 14px 4px}
  .tl .ev:before{content:""; position:absolute; left:-19px; top:3px; width:10px;height:10px;border-radius:50%;
    background:var(--plum); box-shadow:0 0 0 3px var(--mint)}
  .tl .ev .t{font-size:13px; font-weight:700} .tl .ev .d{font-size:11.5px; color:var(--soft)}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--teal-deep); color:#fff; padding:13px 20px; border-radius:13px; font-size:13.5px;
    font-weight:600; box-shadow:0 14px 40px rgba(40,20,55,.35); opacity:0; pointer-events:none;
    transition:.3s; z-index:60; display:flex; align-items:center; gap:11px}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast .tk{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center}
  .empty{padding:40px; text-align:center; color:var(--soft); font-size:13.5px}
  .flash{animation:flash 2s ease}
  @keyframes flash{0%{background:#FFF6DD}30%{background:#FFF6DD}100%{background:transparent}}
  .secTitle{font-size:13px; font-weight:800; color:var(--teal-deep); margin:22px 0 12px; display:flex; align-items:center; gap:8px}
</style>
</head>
<body>
  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="logo">
      <span class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.5-7-10A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 7-.1c0 5.6-7 14.1-7 14.1Z" fill="#fff"/></svg></span>
      <div><b>Convatec CRM</b><span>Operación · Colombia</span></div>
    </div>
    <nav class="nav" id="nav">
      <button class="active" data-p="dash"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg> Dashboard</button>
      <div class="cat">Comercial</div>
      <button data-p="clientes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6M16.5 20a5.5 5.5 0 0 0-2.3-4.4"/></svg> Clientes (Hoja de vida)</button>
      <button data-p="ordenes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5M9 13h7M9 17h7M9 9h2"/></svg> Órdenes de compra</button>
      <button data-p="recompra"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg> Recompra & suscripción</button>
      <div class="cat">Operación</div>
      <button data-p="despacho"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="13" height="11" rx="1"/><path d="M14 9h4l3 3v5h-7z"/><circle cx="5" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg> Despacho & logística</button>
      <button data-p="cadena"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg> Cadena de abastecimiento</button>
    </nav>
    <div class="foot">
      Datos de demostración.<br>Las compras del mockup móvil/web alimentan este CRM en vivo.
      <button onclick="resetData()">↺ Reiniciar datos demo</button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="top">
      <div>
        <h1 id="ttl">Dashboard</h1>
        <div class="sub" id="sub">Visión general de la operación</div>
      </div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A92A6" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Buscar cliente, orden, SKU…" oninput="onSearch(this.value)">
      </div>
      <div class="liveDot"><i></i> En vivo</div>
    </div>

    <div class="scroll">
      <!-- DASHBOARD -->
      <section class="page active" id="p-dash"></section>
      <!-- CLIENTES -->
      <section class="page" id="p-clientes"></section>
      <!-- ORDENES -->
      <section class="page" id="p-ordenes"></section>
      <!-- RECOMPRA -->
      <section class="page" id="p-recompra"></section>
      <!-- DESPACHO -->
      <section class="page" id="p-despacho"></section>
      <!-- CADENA -->
      <section class="page" id="p-cadena"></section>
    </div>
  </div>

  <!-- Drawer hoja de vida -->
  <div class="drawer-bg" id="dbg" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer"></aside>

  <div class="toast" id="toast"><span class="tk">🛒</span><span id="toastMsg"></span></div>

<script src="store.js"></script>
<script>
  var S = window.ConvatecStore;
  var fmt = S.fmt, fdate = S.fecha;
  var COLORS = ["#C2168C","#6E2C91","#2563C9","#1E9E6A","#C97A12","#8A2C8E"];
  function avatarColor(id){ var n=0; for(var i=0;i<id.length;i++) n+=id.charCodeAt(i); return COLORS[n%COLORS.length]; }
  function initials(nm){ var p=nm.split(" "); return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }
  function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  var ESTADO_BADGE = {
    "Recibido":"b-info","En preparación":"b-warn","Despachado":"b-plum",
    "En tránsito":"b-info","Entregado":"b-ok"
  };
  var FLOW = ["Recibido","En preparación","Despachado","En tránsito","Entregado"];

  function chanIcon(c){
    if(c==="Móvil") return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg>';
    if(c==="Web") return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19 19 0 0 1-8.3-3 19 19 0 0 1-6-6 19 19 0 0 1-3-8.4A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>';
  }

  /* ---------------- ROUTER ---------------- */
  var TITLES = {
    dash:["Dashboard","Visión general de la operación"],
    clientes:["Clientes · Hoja de vida","Perfil 360° de cada paciente-cliente"],
    ordenes:["Órdenes de compra","Pedidos entrantes desde todos los canales"],
    recompra:["Recompra & suscripción","Predicción de consumo y reposición programada"],
    despacho:["Despacho & logística","Preparación, transporte y entrega"],
    cadena:["Cadena de abastecimiento","Inventario, proveedores y reabastecimiento"]
  };
  var current = "dash";
  document.getElementById("nav").addEventListener("click", function(e){
    var b = e.target.closest("button[data-p]"); if(!b) return; go(b.dataset.p);
  });
  function go(p){
    current = p;
    document.querySelectorAll(".nav button").forEach(function(b){ b.classList.toggle("active", b.dataset.p===p); });
    document.querySelectorAll(".page").forEach(function(s){ s.classList.toggle("active", s.id==="p-"+p); });
    document.getElementById("ttl").textContent = TITLES[p][0];
    document.getElementById("sub").textContent = TITLES[p][1];
    render();
  }

  /* ---------------- RENDER ---------------- */
  function render(){
    var s = S.get();
    if(current==="dash") renderDash(s);
    if(current==="clientes") renderClientes(s);
    if(current==="ordenes") renderOrdenes(s);
    if(current==="recompra") renderRecompra();
    if(current==="despacho") renderDespacho(s);
    if(current==="cadena") renderCadena(s);
  }

  function renderDash(s){
    var k = S.kpis();
    var recent = s.ordenes.slice(0,6);
    var rec = S.recompra().filter(function(r){return r.estado!=="Programada";}).slice(0,5);
    var lowStock = s.inventario.filter(function(i){return i.stock<=i.rop;});
    var html = ''+
    '<div class="kpis">'+
      kpi("Ventas acumuladas", fmt(k.ventas), "+12% vs. mes ant.", "up", '💳')+
      kpi("Órdenes totales", k.ordenes, k.ordHoy+" nuevas hoy", "up", '📦')+
      kpi("Clientes activos", k.activos+" / "+k.clientes, "Programa me+", "up", '👥')+
      kpi("Recompra estimada (MRR)", fmt(k.mrr), "Ticket medio "+fmt(k.ticket), "up", '🔁')+
    '</div>'+
    '<div class="grid2">'+
      '<div class="card"><div class="hd"><h2>Órdenes recientes</h2><span class="pill">Tiempo real · todos los canales</span></div>'+
        '<div class="bd"><table><thead><tr><th>Orden</th><th>Cliente</th><th>Canal</th><th>Total</th><th>Estado</th></tr></thead><tbody id="recentRows">'+
        recent.map(function(o){ return orderRow(o, s); }).join("")+
        '</tbody></table></div></div>'+
      '<div class="card"><div class="hd"><h2>Alertas operativas</h2></div><div class="bd" style="padding:14px 18px">'+
        (lowStock.length? lowStock.map(function(i){
          return '<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #F4EFF9">'+
            '<span class="badge b-bad">Stock bajo</span><div style="flex:1"><div class="strong" style="font-size:12.5px">'+esc(i.nombre)+'</div>'+
            '<div style="font-size:11.5px;color:var(--soft)">'+i.stock+' u. · punto reorden '+i.rop+'</div></div></div>';
        }).join("") : '<div class="empty">Inventario en niveles óptimos</div>')+
        rec.map(function(r){
          return '<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #F4EFF9">'+
            '<span class="badge '+(r.estado==="Vencida"?"b-bad":"b-warn")+'">Recompra '+r.estado.toLowerCase()+'</span>'+
            '<div style="flex:1"><div class="strong" style="font-size:12.5px">'+esc(r.cliente.nombre)+'</div>'+
            '<div style="font-size:11.5px;color:var(--soft)">'+esc(r.producto)+'</div></div></div>';
        }).join("")+
      '</div></div>'+
    '</div>';
    document.getElementById("p-dash").innerHTML = html;
  }
  function kpi(lbl,val,delta,dir,ico){
    return '<div class="kpi"><div class="lbl"><span class="kico">'+ico+'</span>'+lbl+'</div>'+
      '<div class="val">'+val+'</div><div class="delta '+dir+'">'+(dir==="up"?"▲ ":"▼ ")+delta+'</div></div>';
  }

  function orderRow(o, s){
    var c = clienteOf(s,o.clienteId);
    return '<tr class="clickable" data-ord="'+o.id+'" onclick="openOrder(\''+o.id+'\')">'+
      '<td><span class="mono strong">'+o.id+'</span>'+(o.nuevo?' <span class="badge b-ok" style="margin-left:4px">nuevo</span>':'')+'<div style="font-size:11px;color:var(--soft)">'+S.desde(o.fecha)+'</div></td>'+
      '<td>'+cliMini(c)+'</td>'+
      '<td><span class="chan">'+chanIcon(o.canal)+esc(o.canal)+'</span></td>'+
      '<td class="mono strong">'+fmt(o.total)+'</td>'+
      '<td><span class="badge '+ESTADO_BADGE[o.estado]+'">'+o.estado+'</span></td></tr>';
  }
  function cliMini(c){
    if(!c) return "—";
    return '<div class="cli"><span class="av" style="background:'+avatarColor(c.id)+';width:28px;height:28px;flex:0 0 28px;font-size:11px">'+initials(c.nombre)+'</span>'+
      '<div><div class="nm" style="font-size:12.5px">'+esc(c.nombre)+'</div><div class="mt">'+c.ciudad+'</div></div></div>';
  }
  function clienteOf(s,id){ for(var i=0;i<s.clientes.length;i++) if(s.clientes[i].id===id) return s.clientes[i]; return null; }

  function renderClientes(s){
    var html = '<div class="cgrid">'+ s.clientes.map(function(c){
      var pedidos = s.ordenes.filter(function(o){return o.clienteId===c.id;});
      var ltv = pedidos.reduce(function(a,o){return a+o.total;},0);
      var rb = c.riesgo==="Alto"?"b-bad":(c.riesgo==="Medio"?"b-warn":"b-ok");
      var mb = c.meplus.estado==="Activo"?"b-ok":(c.meplus.estado==="Onboarding"?"b-info":"b-mut");
      return '<div class="ccard" onclick="openCliente(\''+c.id+'\')">'+
        '<div class="row"><span class="av" style="background:'+avatarColor(c.id)+'">'+initials(c.nombre)+'</span>'+
          '<div style="flex:1"><div class="nm" style="font-size:14.5px;font-weight:800">'+esc(c.nombre)+'</div>'+
          '<div class="mt" style="font-size:12px;color:var(--soft)">'+c.id+' · '+esc(c.estoma.tipo)+'</div></div>'+
          '<span class="badge '+mb+'">me+ '+c.meplus.estado+'</span></div>'+
        '<div class="meta">'+
          mcell("Ciudad", c.ciudad)+ mcell("Pedidos", pedidos.length+" · "+fmt(ltv))+
          mcell("Segmento", c.segmento)+ mcell("Riesgo fuga", '<span class="badge '+rb+'">'+c.riesgo+'</span>')+
        '</div></div>';
    }).join("") + '</div>';
    document.getElementById("p-clientes").innerHTML = html;
  }
  function mcell(k,v){ return '<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

  function renderOrdenes(s){
    var html = '<div class="card"><div class="hd"><h2>Todas las órdenes</h2><span class="pill">'+s.ordenes.length+' órdenes</span></div>'+
      '<div class="bd"><table><thead><tr><th>Orden</th><th>Cliente</th><th>Canal</th><th>Productos</th><th>Total</th><th>Estado</th><th></th></tr></thead><tbody>'+
      s.ordenes.map(function(o){
        var c = clienteOf(s,o.clienteId);
        var prods = o.items.map(function(it){return it.qty+"× "+it.nombre.split(" ").slice(0,2).join(" ");}).join(", ");
        return '<tr class="clickable" data-ord="'+o.id+'">'+
          '<td onclick="openOrder(\''+o.id+'\')"><span class="mono strong">'+o.id+'</span>'+(o.nuevo?' <span class="badge b-ok">nuevo</span>':'')+'<div style="font-size:11px;color:var(--soft)">'+fdate(o.fecha)+'</div></td>'+
          '<td onclick="openOrder(\''+o.id+'\')">'+cliMini(c)+'</td>'+
          '<td><span class="chan">'+chanIcon(o.canal)+esc(o.canal)+'</span></td>'+
          '<td style="max-width:220px;font-size:12px;color:var(--muted)">'+esc(prods)+'</td>'+
          '<td class="mono strong">'+fmt(o.total)+'</td>'+
          '<td><span class="badge '+ESTADO_BADGE[o.estado]+'">'+o.estado+'</span></td>'+
          '<td>'+(o.estado!=="Entregado"?'<button class="btn sm" onclick="advance(\''+o.id+'\')">Avanzar →</button>':'<span class="badge b-ok">✓</span>')+'</td></tr>';
      }).join("")+
      '</tbody></table></div></div>';
    document.getElementById("p-ordenes").innerHTML = html;
  }

  function renderDespacho(s){
    var board = FLOW.map(function(st){
      var ords = s.ordenes.filter(function(o){return o.estado===st;});
      return '<div class="card" style="min-width:0"><div class="hd" style="padding:13px 15px"><h2 style="font-size:13px">'+st+'</h2><span class="pill">'+ords.length+'</span></div>'+
        '<div class="bd" style="padding:10px 12px; display:flex; flex-direction:column; gap:9px; min-height:80px">'+
        (ords.length? ords.map(function(o){
          var c = clienteOf(s,o.clienteId);
          return '<div onclick="openOrder(\''+o.id+'\')" style="cursor:pointer; border:1px solid var(--line); border-radius:11px; padding:11px; background:#FCFAFE">'+
            '<div style="display:flex;justify-content:space-between;align-items:center"><span class="mono strong" style="font-size:12px">'+o.id+'</span><span class="chan" style="font-size:11px">'+chanIcon(o.canal)+'</span></div>'+
            '<div style="font-size:12px;font-weight:700;margin:4px 0 2px">'+esc(c?c.nombre:"—")+'</div>'+
            '<div style="font-size:11px;color:var(--soft)">'+esc(o.despacho.transportadora)+' · '+esc(o.despacho.guia)+'</div>'+
            '<div style="font-size:11px;color:var(--muted);margin-top:4px">'+(o.estado==="Entregado"?"Entregado":"ETA "+fdate(o.despacho.eta))+'</div>'+
          '</div>';
        }).join("") : '<div style="text-align:center;color:#C8BFD4;font-size:12px;padding:18px 0">—</div>')+
        '</div></div>';
    }).join("");
    document.getElementById("p-despacho").innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start">'+board+'</div>';
  }

  function renderCadena(s){
    var totalEnTransito = s.inventario.reduce(function(a,i){return a+i.enTransito;},0);
    var low = s.inventario.filter(function(i){return i.stock<=i.rop;}).length;
    var html =
    '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'+
      kpi("SKUs en catálogo", s.inventario.length, "Líneas Esteem+, SenSura, Natura+", "up", '🏷️')+
      kpi("Bajo punto de reorden", low, low? "Requiere reposición":"Todo ok", low?"down":"up", '⚠️')+
      kpi("Unidades en tránsito", totalEnTransito, "Desde Convatec Global Supply", "up", '🚚')+
    '</div>'+
    '<div class="card"><div class="hd"><h2>Inventario por SKU</h2><span class="pill">CD Funza (Bogotá)</span></div>'+
    '<div class="bd"><table><thead><tr><th>SKU</th><th>Producto</th><th>Proveedor</th><th>Stock</th><th>Cobertura</th><th>Lead time</th><th>Estado</th></tr></thead><tbody>'+
    s.inventario.map(function(i){
      var pct = Math.min(100, Math.round(i.stock/(i.rop*2.5)*100));
      var low = i.stock<=i.rop;
      return '<tr><td class="mono" style="font-size:12px;color:var(--muted)">'+i.sku+'</td>'+
        '<td><div class="strong" style="font-size:12.5px">'+esc(i.nombre)+'</div><div style="font-size:11px;color:var(--soft)">'+esc(i.linea)+'</div></td>'+
        '<td style="font-size:12px;color:var(--muted)">'+esc(i.proveedor)+'</td>'+
        '<td class="mono strong">'+i.stock+' u.</td>'+
        '<td style="min-width:130px"><div class="bar"><i style="width:'+pct+'%;'+(low?'background:linear-gradient(90deg,#C0392B,#E67E22)':'')+'"></i></div></td>'+
        '<td class="mono" style="font-size:12px">'+i.leadTime+' días</td>'+
        '<td>'+(low? '<span class="badge b-bad">Reordenar '+(i.enTransito?'· '+i.enTransito+' en ruta':'')+'</span>' : '<span class="badge b-ok">Óptimo</span>')+'</td></tr>';
    }).join("")+
    '</tbody></table></div></div>';
    document.getElementById("p-cadena").innerHTML = html;
  }

  function renderRecompra(){
    var r = S.recompra();
    var html = '<div class="card"><div class="hd"><h2>Predicción de recompra por cliente</h2><span class="pill">Basado en frecuencia de consumo</span></div>'+
    '<div class="bd"><table><thead><tr><th>Cliente</th><th>Producto base</th><th>Frecuencia</th><th>Última compra</th><th>Próxima estimada</th><th>Estado</th><th></th></tr></thead><tbody>'+
    r.map(function(x){
      var b = x.estado==="Vencida"?"b-bad":(x.estado==="Próxima"?"b-warn":"b-info");
      var dr = x.diasRest<0? Math.abs(x.diasRest)+" días de retraso" : "en "+x.diasRest+" días";
      return '<tr><td>'+cliMini(x.cliente)+'</td>'+
        '<td><div class="strong" style="font-size:12.5px">'+esc(x.producto)+'</div><div style="font-size:11px;color:var(--soft)">'+x.sku+'</div></td>'+
        '<td class="mono" style="font-size:12px">cada '+x.frecuencia+' días</td>'+
        '<td style="font-size:12px">'+fdate(x.ultima)+'</td>'+
        '<td style="font-size:12px"><span class="strong">'+fdate(x.proxima)+'</span><div style="font-size:11px;color:var(--soft)">'+dr+'</div></td>'+
        '<td><span class="badge '+b+'">'+x.estado+'</span></td>'+
        '<td><button class="btn sm pri" onclick="recompraNow(\''+x.cliente.id+'\',\''+x.sku+'\')">Generar pedido</button></td></tr>';
    }).join("")+
    '</tbody></table></div></div>';
    document.getElementById("p-recompra").innerHTML = html;
  }

  /* ---------------- DRAWER: HOJA DE VIDA ---------------- */
  function openCliente(id){
    var s = S.get(); var c = clienteOf(s,id);
    var pedidos = s.ordenes.filter(function(o){return o.clienteId===id;});
    var ltv = pedidos.reduce(function(a,o){return a+o.total;},0);
    var rec = S.recompra().filter(function(r){return r.cliente.id===id;})[0];
    var d = document.getElementById("drawer");
    d.innerHTML =
    '<div class="dh" style="position:relative">'+
      '<button class="x" onclick="closeDrawer()">✕</button>'+
      '<div style="display:flex;align-items:center;gap:14px">'+
        '<span class="av" style="width:56px;height:56px;flex:0 0 56px;font-size:20px;background:rgba(255,255,255,.18)">'+initials(c.nombre)+'</span>'+
        '<div><div style="font-size:20px;font-weight:800">'+esc(c.nombre)+'</div>'+
        '<div style="font-size:12.5px;color:#D9C8EC;margin-top:2px">'+c.id+' · '+c.doc+' · '+c.edad+' años</div></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'+
        '<span class="badge" style="background:rgba(255,255,255,.16);color:#fff">'+esc(c.estoma.tipo)+'</span>'+
        '<span class="badge" style="background:rgba(255,255,255,.16);color:#fff">me+ '+esc(c.meplus.nivel)+'</span>'+
        '<span class="badge" style="background:rgba(255,255,255,.16);color:#fff">LTV '+fmt(ltv)+'</span>'+
        '<span class="badge" style="background:rgba(255,255,255,.16);color:#fff">'+pedidos.length+' pedidos</span>'+
      '</div>'+
    '</div>'+
    '<div class="db">'+
      '<div class="sec"><h3>🩺 Perfil clínico del estoma</h3><div class="dl">'+
        dd("Tipo de estoma", c.estoma.tipo)+ dd("Motivo", c.estoma.motivo)+
        dd("Fecha de cirugía", fdate(c.estoma.cirugia))+ dd("Diámetro", c.estoma.diametro)+
        dd("Estado de la piel", c.estoma.piel)+ dd("EPS / Régimen", c.eps+" · "+c.regimen)+
      '</div></div>'+
      '<div class="sec"><h3>💜 Programa me+</h3><div class="dl">'+
        dd("Estado", c.meplus.estado)+ dd("Nivel", c.meplus.nivel)+
        dd("Enfermera asignada", c.meplus.enfermera)+ dd("Última visita", fdate(c.meplus.ultimaVisita))+
      '</div><div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px"><span class="k" style="color:var(--soft);text-transform:uppercase;font-size:11px">Adherencia al tratamiento</span><span class="strong">'+c.meplus.adherencia+'%</span></div>'+
      '<div class="bar"><i style="width:'+c.meplus.adherencia+'%"></i></div></div></div>'+
      '<div class="sec"><h3>📇 Datos de contacto</h3><div class="dl">'+
        dd("Teléfono", c.tel)+ dd("Email", c.email)+ dd("Ciudad", c.ciudad+" · "+c.barrio)+ dd("Cliente desde", fdate(c.desde))+
      '</div></div>'+
      (rec? '<div class="sec"><h3>🔁 Próxima recompra</h3><div class="dl">'+
        dd("Producto", rec.producto)+ dd("Frecuencia", "cada "+rec.frecuencia+" días")+
        dd("Próxima estimada", fdate(rec.proxima))+ dd("Estado", rec.estado)+
      '</div><button class="btn pri sm" style="margin-top:12px" onclick="recompraNow(\''+c.id+'\',\''+rec.sku+'\')">Generar pedido de recompra</button></div>' : '')+
      '<div class="sec"><h3>🧾 Historial de órdenes</h3>'+
        (pedidos.length? '<div class="tl">'+ pedidos.map(function(o){
          return '<div class="ev"><div class="t">'+o.id+' · '+fmt(o.total)+' <span class="badge '+ESTADO_BADGE[o.estado]+'" style="margin-left:4px">'+o.estado+'</span></div>'+
            '<div class="d">'+fdate(o.fecha)+' · '+esc(o.canal)+' · '+o.items.map(function(it){return it.qty+"× "+it.nombre.split(" ").slice(0,2).join(" ");}).join(", ")+'</div></div>';
        }).join("")+'</div>' : '<div class="empty">Sin pedidos aún</div>')+
      '</div>'+
    '</div>';
    document.getElementById("dbg").classList.add("open");
    d.classList.add("open");
  }
  function dd(k,v){ return '<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

  function openOrder(id){
    var s = S.get(); var o=null;
    for(var i=0;i<s.ordenes.length;i++) if(s.ordenes[i].id===id) o=s.ordenes[i];
    if(!o) return;
    var c = clienteOf(s,o.clienteId);
    var step = FLOW.indexOf(o.estado);
    var d = document.getElementById("drawer");
    d.innerHTML =
    '<div class="dh" style="position:relative">'+
      '<button class="x" onclick="closeDrawer()">✕</button>'+
      '<div style="font-size:12.5px;color:#D9C8EC">Orden de compra · canal '+esc(o.canal)+'</div>'+
      '<div style="font-size:22px;font-weight:800;margin-top:2px">'+o.id+'</div>'+
      '<div style="font-size:12.5px;color:#D9C8EC;margin-top:3px">'+fdate(o.fecha)+' · '+S.desde(o.fecha)+'</div>'+
    '</div>'+
    '<div class="db">'+
      '<div class="sec"><h3>📦 Estado del despacho</h3>'+
        '<div class="flow" style="margin:6px 0 14px">'+FLOW.map(function(_,i){return '<div class="st '+(i<=step?"done":"")+'"></div>';}).join("")+'</div>'+
        '<div class="dl">'+
          dd("Estado actual", '<span class="badge '+ESTADO_BADGE[o.estado]+'">'+o.estado+'</span>')+
          dd("Transportadora", o.despacho.transportadora)+
          dd("Guía", o.despacho.guia)+
          dd("ETA / entrega", o.estado==="Entregado"?"Entregado":fdate(o.despacho.eta))+
          dd("Bodega origen", o.despacho.bodega)+
        '</div>'+
        (o.estado!=="Entregado"?'<button class="btn pri sm" style="margin-top:12px" onclick="advance(\''+o.id+'\'); openOrder(\''+o.id+'\')">Avanzar al siguiente estado →</button>':'')+
      '</div>'+
      '<div class="sec"><h3>🛒 Detalle de la compra</h3><table style="font-size:12.5px"><tbody>'+
        o.items.map(function(it){ return '<tr><td style="padding:9px 0;border-bottom:1px solid #F4EFF9"><div class="strong">'+esc(it.nombre)+'</div><div style="font-size:11px;color:var(--soft)">'+it.sku+' · '+esc(it.linea)+'</div></td>'+
          '<td style="text-align:right;padding:9px 0;border-bottom:1px solid #F4EFF9" class="mono">'+it.qty+' × '+fmt(it.precio)+'</td></tr>'; }).join("")+
        '<tr><td style="padding:11px 0" class="strong">Total</td><td style="text-align:right;padding:11px 0" class="mono strong" style="font-size:15px">'+fmt(o.total)+'</td></tr>'+
      '</tbody></table></div>'+
      (c? '<div class="sec"><h3>👤 Cliente</h3><div class="cli" style="cursor:pointer" onclick="openCliente(\''+c.id+'\')">'+
        '<span class="av" style="background:'+avatarColor(c.id)+'">'+initials(c.nombre)+'</span>'+
        '<div><div class="nm">'+esc(c.nombre)+'</div><div class="mt">'+c.id+' · '+esc(c.estoma.tipo)+' · '+c.ciudad+'</div></div></div>'+
        '<button class="btn sm" style="margin-top:12px" onclick="openCliente(\''+c.id+'\')">Ver hoja de vida →</button></div>' : '')+
      (o.nota? '<div class="sec"><h3>📝 Nota</h3><div style="font-size:12.5px;color:var(--muted)">'+esc(o.nota)+'</div></div>' : '')+
    '</div>';
    document.getElementById("dbg").classList.add("open");
    d.classList.add("open");
  }
  function closeDrawer(){ document.getElementById("dbg").classList.remove("open"); document.getElementById("drawer").classList.remove("open"); }

  /* ---------------- ACTIONS ---------------- */
  function advance(id){ S.advance(id); }
  function recompraNow(cliId, sku){
    S.addOrder({ clienteId: cliId, canal:"Call center", items:[{sku:sku, qty:1}] });
    toast("Pedido de recompra generado");
  }
  function resetData(){ if(confirm("¿Reiniciar los datos de demostración?")){ S.reset(); closeDrawer(); render(); } }

  function onSearch(v){
    v=(v||"").toLowerCase().trim();
    if(current!=="clientes" && current!=="ordenes") go("clientes");
    document.querySelectorAll("#p-clientes .ccard, #p-ordenes tbody tr").forEach(function(el){
      el.style.display = !v || el.textContent.toLowerCase().indexOf(v)>=0 ? "" : "none";
    });
  }

  /* ---------------- LIVE ---------------- */
  var toastT;
  function toast(msg){
    document.getElementById("toastMsg").textContent = msg;
    var t=document.getElementById("toast"); t.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");}, 3200);
  }
  S.subscribe(function(s, orden){
    render();
    if(orden){
      var c = clienteOf(s, orden.clienteId);
      toast("Nueva compra "+orden.id+" · "+(c?c.nombre:"")+" · "+orden.canal);
      // resalta la primera fila
      setTimeout(function(){
        var row = document.querySelector('[data-ord="'+orden.id+'"]');
        if(row) row.classList.add("flash");
      }, 50);
    }
  });

  render();
</script>
</body>
</html>
